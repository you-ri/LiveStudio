openapi: '3.1.1'
info:
  title: LiveStudio API
  version: '0.1'
  description: |
    `jp.lilium.livestudio` が [Remote Control API](../remotecontrol/index.md)
    の上に足す HTTP ルートです。`LiveStudioRemoteControl` が同じサーバー・同じポートへ登録するので、
    2 つ目のリスナーが立つわけではありません。

    ここにあるのは、汎用のライブオブジェクト面では表せないもの — マニピュレーターだけです。
    セッションをサーバー側に保持し (状態を持つ)、フレームをバイナリで返します。

    ただの値であるもの (ライトの明るさ、カメラの画角、表情のウェイト) は*ここにはありません*。
    それらは公開プロパティで、`GET|PUT /live/object/{id}/{path}` から読み書きします。汎用側で
    足りないときにだけ、このリファレンスを見てください。

    ここのルートもすべて `/live/` の下にあります。このパッケージは特定のアプリに依存しない
    汎用基盤で、ホストアプリとルートテーブルを共有するため、`camera` や `assets` のような
    一般名をルートの根元で押さえないようにしています。それ以外のプレフィックスは組み込む側の
    アプリのために空けてあります (詳細は Remote Control API の「名前空間」)。

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: '3002'
        description: >
          アプリの RemoteControl サーバーが待ち受けるポート。3002 はパッケージ既定値で、
          出荷される LiveStudio アプリでは上書きされているのが普通です。

tags:
  - name: マニピュレーター
    x-slug: manipulator
    description: >
      リモートアプリの Transform ギズモを支えるオフスクリーンカメラ。1 つのプロパティに対して
      セッションを開き、ドラッグ中はフレームをポーリングし、終わったら閉じます。

x-tagGroups:
  - name: オーサリング
    tags: [マニピュレーター]

paths:
  # ---------------------------------------------------------------- カメラ
  # カメラに専用の口はありません。カメラはただのライブオブジェクトなので、一覧は
  # `GET /live/object` (`@type` が `LiveCamera`)、ライブにするのはそのオブジェクトの
  # `Switch` 関数 (`POST /live/function/{cameraId}/switch`)、画角や注視先も通常の公開
  # プロパティです。プレビュー画像もカメラの `preview` メンバーが担い、そのメンバーへの
  # 直接 GET (`GET /live/object/{cameraId}/preview`) が PNG で応えます (JSON の読みには
  # メンバー自身のアドレスが値として載る — 詳細は Remote Control API のプロパティ取得)。

  # ---------------------------------------------------------------- アバター
  # アバターに専用の口はありません。ファイルの登録と選択は資産共通のライブオブジェクト面
  # (`ExternalAssetManager` の `AddAsset` と各資産の `enabled`)、モデルパスを直に持つ
  # コンポーネントは通常の公開プロパティです。読み込みの進捗だけは書き込みの応答に乗らないので、
  # `vrm_load_*` イベントとして受信箱 (`GET /live/events`) に届きます。読み込み中に接続してきた
  # クライアントにも、名乗った時点で知らされます。

  # 表情に専用の口はありません。表情は汎用のライブオブジェクト面がそのまま扱えます —
  # 使える表情の一覧は `POST /live/function/{avatarId}/getavailableexpressions`、
  # 各ウェイトの読み書きは通常の公開プロパティ
  # `GET/PUT /live/object/{avatarId}/expressions[<name>]/weight` です
  # (ウェイトは表示中プロパティの同期に乗るので、表情カードが画面に出ているあいだだけ、
  # それを見ているクライアントにだけ届きます)。

  # スナップショットのサムネイルに専用の口はありません。スナップショットファイルもプロジェクトの
  # 資産なので、撮影画像は資産共通の `GET /live/asset/{key}/@image` から取れます (キーにはスナップ
  # ショットのライブオブジェクトが各項目に載せている `reference` を渡します)。

  # ---------------------------------------------------------------- マニピュレーター
  /live/manipulator/open:
    post:
      tags: [マニピュレーター]
      summary: マニピュレーターのセッションを開く
      description: >
        オフスクリーンカメラを、Transform 値を持つプロパティ 1 つに結び付けます。返ってくる
        `sessionId` が、以降のマニピュレーター呼び出しすべてのハンドルです。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectId]
              properties:
                objectId:
                  type: string
                  example: "3470a41c-f079-4d30-a002-3468fda088f7"
                propertyPath:
                  type: string
                  example: "transform"
                  description: "編集対象のプロパティ。オブジェクト自身の transform なら省略。"
      responses:
        '200':
          description: セッションと、これから返るフレームの大きさ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManipulatorOpenResponse"
        '400':
          description: 本文が空、または `objectId` がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: そのオブジェクトが無い、またはこの方式で編集できないプロパティ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [マニピュレーター]
      summary: マニピュレーターのセッションを閉じる
      description: "冪等です。すでに閉じた (または不明な) セッションでも 204 を返します。"
      parameters:
        - $ref: "#/components/parameters/ManipulatorSession"
      responses:
        '204':
          description: 閉じた。

  /live/manipulator/image:
    get:
      tags: [マニピュレーター]
      summary: マニピュレーターのフレームを、そのカメラ状態と一緒に取得する
      description: >
        PNG だけではギズモを重ねて描けません。そのフレームがどの行列で描かれたかが要ります。
        別リクエストにせず `X-Manipulator-State` レスポンスヘッダーに同乗させているので、画像と
        状態が食い違うことは原理的に起きません。

        ヘッダーの中身は UTF-8 JSON を base64 にしたものです。

        ```json
        {
          "view":       [16 個の float, 列優先],
          "projection": [16 個の float, 列優先],
          "parent":     { "position": {x,y,z}, "rotation": {x,y,z,w}, "scale": {x,y,z} },
          "target":     { "position": {x,y,z}, "rotation": {x,y,z,w}, "scale": {x,y,z} },
          "viewport":   { "width": 512, "height": 512 }
        }
        ```

        `parent` は編集対象の親のワールド変換、`target` は対象自身のローカル変換です。
        `Access-Control-Expose-Headers` を付けてあるので、ブラウザからでもクロスオリジンで
        ヘッダーを読めます。
      parameters:
        - $ref: "#/components/parameters/ManipulatorSession"
      responses:
        '200':
          description: フレーム。カメラ状態は `X-Manipulator-State` に入っています。
          headers:
            X-Manipulator-State:
              description: "このフレームちょうどのカメラ状態。base64(UTF-8(JSON))。"
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: セッションが不明、または閉じている。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: キャプチャに失敗した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/manipulator/camera:
    put:
      tags: [マニピュレーター]
      summary: マニピュレーターのカメラを動かす
      description: >
        すべてのフィールドが任意で、同時に指定すれば合成されます。今の操作で変わった分だけを
        送ってください。結果を見るには、その後フレームを取り直します。
      parameters:
        - $ref: "#/components/parameters/ManipulatorSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManipulatorCameraPoseRequest"
      responses:
        '204':
          description: 適用した。
        '400':
          description: 本文が空、または不正。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: セッションが不明、または閉じている。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- 入力
  # 入力アクションに専用の口はありません。入力マップはライブオブジェクト (`AvatarInput` =
  # ライブ型名 `InputActions`) で、アクション 1 つはその `actions` 配列の要素です。要素は
  # 名前がキー (`[LiveKey]`) なので `GET /live/object/{id}/actions[<action>]/binding` のように
  # 名前で辿れ、割り当て直しは同じ要素のライブ関数
  # `POST /live/function/{id}/actions[<action>]/rebind` です。
  # 呼ぶと次に押されたキーを待ち受け、結果は `binding` の値に現れます (呼び出しは待ちません)。

components:
  parameters:
    ManipulatorSession:
      in: query
      name: session
      required: true
      schema:
        type: string
        format: uuid
      description: "`POST /live/manipulator/open` が返したセッション id。"

  schemas:
      ErrorResponse:
        type: object
        properties:
          error:
            type: string
            example: "Session not found."

      ManipulatorOpenResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          sessionId:
            type: string
            format: uuid
          width:
            type: integer
            example: 512
          height:
            type: integer
            example: 512
          aspect:
            type: number
            example: 1
          message:
            type: string

      ManipulatorCameraPoseRequest:
        type: object
        properties:
          yaw:
            type: number
            description: "周回のヨー角 (度)。絶対値。"
          pitch:
            type: number
            description: "周回のピッチ角 (度)。絶対値。"
          distance:
            type: number
            description: "注視点からの距離。絶対値。"
          focus:
            type: boolean
            description: "注視点を編集対象へ取り直す。ほかのフィールドと併用できます。"
          panDx:
            type: number
            description: >
              注視点を画面ピクセル単位で平行移動する量。右方向が正。現在の距離と画角からワールド
              単位へ換算します — シーンビューの中ボタンドラッグ相当です。
          panDy:
            type: number
            description: "注視点を画面ピクセル単位で平行移動する量。下方向が正。"

