openapi: '3.1.1'
info:
  title: LiveStudio API
  version: '0.1'
  description: |
    `jp.lilium.livestudio` が [Remote Control API](../remotecontrol/index.md)
    の上に足す HTTP ルートです。`LiveStudioRemoteControl` が同じサーバー・同じポートへ登録するので、
    2 つ目のリスナーが立つわけではありません。

    ここにあるのは、汎用のライブオブジェクト面では表せない 2 種類だけです。

    - **バイナリ** — カメラのプレビュー、マニピュレーターのフレーム
    - **状態を持つ / 時間がかかる** — VRM の読み込み、マニピュレーターのセッション保持、
      入力アクションの再バインド

    ただの値であるもの (ライトの明るさ、カメラの画角、表情のウェイト) は*ここにはありません*。
    それらは公開プロパティで、`GET|PUT /live/object/{id}/{path}` から読み書きします。汎用側で
    足りないときにだけ、このリファレンスを見てください。

    ここのルートもすべて `/live/` の下にあります。このパッケージは特定のアプリに依存しない
    汎用基盤で、ホストアプリとルートテーブルを共有するため、`camera` や `assets` のような
    一般名をルートの根元で押さえないようにしています。それ以外のプレフィックスは組み込む側の
    アプリのために空けてあります (詳細は Remote Control API の「名前空間」)。

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: '3002'
        description: >
          アプリの RemoteControl サーバーが待ち受けるポート。3002 はパッケージ既定値で、
          出荷される LiveStudio アプリでは上書きされているのが普通です。

tags:
  - name: カメラ
    x-slug: camera
    description: カメラの一覧、ライブカメラの切り替え、プレビュー画像。
  - name: アバター
    x-slug: avatar
    description: VRM の読み込みと、表情の一覧。
  - name: マニピュレーター
    x-slug: manipulator
    description: >
      リモートアプリの Transform ギズモを支えるオフスクリーンカメラ。1 つのプロパティに対して
      セッションを開き、ドラッグ中はフレームをポーリングし、終わったら閉じます。
  - name: 入力
    x-slug: input
    description: ランタイムのキーバインドと、対話的な再バインド。

x-tagGroups:
  - name: シーン
    tags: [カメラ, アバター]
  - name: オーサリング
    tags: [マニピュレーター, 入力]

paths:
  # ---------------------------------------------------------------- カメラ
  /live/camera:
    get:
      tags: [カメラ]
      summary: カメラを一覧する
      responses:
        '200':
          description: シーン上のすべてのカメラ。ライブのものには印が付きます。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraListResponse"
    post:
      tags: [カメラ]
      summary: カメラを操作する
      description: >
        本文に動詞を入れる形の 1 本口で、ただのプロパティではない操作のために残しています。
        画角や注視先は通常の公開プロパティなので、それらは
        `PUT /live/object/{cameraId}/{path}` を使ってください。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraControlRequest"
      responses:
        '200':
          description: 操作が適用されたかどうか。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        '400':
          description: 本文が不正、または `data` がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/camera/switch:
    post:
      tags: [カメラ]
      summary: カメラをライブにする
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cameraId]
              properties:
                cameraId:
                  type: string
                  format: uuid
                  example: "2e910ddf-8cd8-4fb2-92f3-44b1ccd20c5f"
      responses:
        '200':
          description: 切り替えた。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        '400':
          description: "`cameraId` がない、または解釈できない。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/camera/image:
    get:
      tags: [カメラ]
      summary: カメラのプレビュー画像を取得する
      description: >
        そのカメラを 1 回レンダリングし、アスペクト比を保った縮小 PNG を返します。プレビューは
        これをポーリングして作ります。ストリームはありません。
      parameters:
        - in: query
          name: camera
          required: false
          schema:
            type: string
            format: uuid
          description: "カメラ id。省略するとライブのカメラを撮ります。"
      responses:
        '200':
          description: 画像。
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: そのカメラがない、またはまだ画像が無い。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- アバター
  /live/vrm/load:
    post:
      tags: [アバター]
      summary: VRM ファイルをアバターとして読み込む
      description: >
        読み込みが受け付けられた時点で応答します。完了は待ちません。大きな VRM は数秒かかり、
        その間リクエストで接続を掴んでいるわけにはいかないためです。進捗と完了は
        `vrm_load_*` イベントとして受信箱 (`GET /live/events`) に届きます。読み込み中に接続してきた
        クライアントにも、名乗った時点で知らされます。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filePath]
              properties:
                filePath:
                  type: string
                  example: "C:/Users/me/Documents/avatars/mine.vrm"
      responses:
        '200':
          description: 読み込みを受け付けて開始した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        '400':
          description: 本文が空、`filePath` がない、または VRM として受け付けられないパス。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/vrm/reset:
    post:
      tags: [アバター]
      summary: 現在のアバターを降ろす
      responses:
        '200':
          description: アバターをリセットした。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"

  # 表情に専用の口はありません。表情は汎用のライブオブジェクト面がそのまま扱えます —
  # 使える表情の一覧は `POST /live/function/{avatarId}/getavailableexpressions`、
  # 各ウェイトの読み書きは通常の公開プロパティ
  # `GET/PUT /live/object/{avatarId}/expressions[<name>]/weight` です
  # (ウェイトは表示中プロパティの同期に乗るので、表情カードが画面に出ているあいだだけ、
  # それを見ているクライアントにだけ届きます)。

  # スナップショットのサムネイルに専用の口はありません。スナップショットファイルもプロジェクトの
  # 資産なので、撮影画像は資産共通の `GET /live/asset/{key}/@image` から取れます (キーにはスナップ
  # ショットのライブオブジェクトが各項目に載せている `reference` を渡します)。

  # ---------------------------------------------------------------- マニピュレーター
  /live/manipulator/open:
    post:
      tags: [マニピュレーター]
      summary: マニピュレーターのセッションを開く
      description: >
        オフスクリーンカメラを、Transform 値を持つプロパティ 1 つに結び付けます。返ってくる
        `sessionId` が、以降のマニピュレーター呼び出しすべてのハンドルです。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectId]
              properties:
                objectId:
                  type: string
                  example: "3470a41c-f079-4d30-a002-3468fda088f7"
                propertyPath:
                  type: string
                  example: "transform"
                  description: "編集対象のプロパティ。オブジェクト自身の transform なら省略。"
      responses:
        '200':
          description: セッションと、これから返るフレームの大きさ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManipulatorOpenResponse"
        '400':
          description: 本文が空、または `objectId` がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: そのオブジェクトが無い、またはこの方式で編集できないプロパティ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [マニピュレーター]
      summary: マニピュレーターのセッションを閉じる
      description: "冪等です。すでに閉じた (または不明な) セッションでも 204 を返します。"
      parameters:
        - $ref: "#/components/parameters/ManipulatorSession"
      responses:
        '204':
          description: 閉じた。

  /live/manipulator/image:
    get:
      tags: [マニピュレーター]
      summary: マニピュレーターのフレームを、そのカメラ状態と一緒に取得する
      description: >
        PNG だけではギズモを重ねて描けません。そのフレームがどの行列で描かれたかが要ります。
        別リクエストにせず `X-Manipulator-State` レスポンスヘッダーに同乗させているので、画像と
        状態が食い違うことは原理的に起きません。

        ヘッダーの中身は UTF-8 JSON を base64 にしたものです。

        ```json
        {
          "view":       [16 個の float, 列優先],
          "projection": [16 個の float, 列優先],
          "parent":     { "position": {x,y,z}, "rotation": {x,y,z,w}, "scale": {x,y,z} },
          "target":     { "position": {x,y,z}, "rotation": {x,y,z,w}, "scale": {x,y,z} },
          "viewport":   { "width": 512, "height": 512 }
        }
        ```

        `parent` は編集対象の親のワールド変換、`target` は対象自身のローカル変換です。
        `Access-Control-Expose-Headers` を付けてあるので、ブラウザからでもクロスオリジンで
        ヘッダーを読めます。
      parameters:
        - $ref: "#/components/parameters/ManipulatorSession"
      responses:
        '200':
          description: フレーム。カメラ状態は `X-Manipulator-State` に入っています。
          headers:
            X-Manipulator-State:
              description: "このフレームちょうどのカメラ状態。base64(UTF-8(JSON))。"
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: セッションが不明、または閉じている。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: キャプチャに失敗した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/manipulator/camera:
    put:
      tags: [マニピュレーター]
      summary: マニピュレーターのカメラを動かす
      description: >
        すべてのフィールドが任意で、同時に指定すれば合成されます。今の操作で変わった分だけを
        送ってください。結果を見るには、その後フレームを取り直します。
      parameters:
        - $ref: "#/components/parameters/ManipulatorSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManipulatorCameraPoseRequest"
      responses:
        '204':
          description: 適用した。
        '400':
          description: 本文が空、または不正。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: セッションが不明、または閉じている。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- 入力
  /live/input-actions:
    get:
      tags: [入力]
      summary: ランタイムの入力アクションとバインドを一覧する
      responses:
        '200':
          description: 有効なアクションマップに属するすべてのアクション。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputActionsListResponse"

  /live/input-actions/bind:
    post:
      tags: [入力]
      summary: 入力アクションを対話的に再バインドする
      description: >
        対話的な再バインドを開始します。アプリはユーザーが次に動かしたコントロールを待ち受け、
        それを割り当てます。レスポンスは、実際に取り込まれたバインドを報告します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionName]
              properties:
                actionName:
                  type: string
                  example: "ToggleCamera"
                bindingIndex:
                  type: integer
                  example: 0
                  description: "そのアクションの何番目のバインドを置き換えるか。"
      responses:
        '200':
          description: >
            結果。開始できなかった場合 (アクションが無い、すでに待ち受け中) も 200 で返り、
            `success: false` になります。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputActionBindResponse"
        '400':
          description: 本文が不正、または `actionName` がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    ManipulatorSession:
      in: query
      name: session
      required: true
      schema:
        type: string
        format: uuid
      description: "`POST /live/manipulator/open` が返したセッション id。"

  schemas:
      ErrorResponse:
        type: object
        properties:
          error:
            type: string
            example: "Session not found."

      CommandResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: "Camera switched."
          timestamp:
            type: string
            format: date-time

      CameraApiInfo:
        type: object
        properties:
          id:
            type: string
            format: uuid
            example: "2e910ddf-8cd8-4fb2-92f3-44b1ccd20c5f"
          name:
            type: string
            example: "Front"
          isLive:
            type: boolean
            example: true
            description: "いま出力に使われているカメラなら true。"
          fov:
            type: number
            example: 35
          aspect:
            type: number
            example: 1.7777778
          lookAt:
            type: string
            example: "Head"

      CameraListResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          cameras:
            type: array
            items:
              $ref: "#/components/schemas/CameraApiInfo"
          timestamp:
            type: string
            format: date-time

      CameraControlRequest:
        type: object
        required: [data]
        properties:
          type:
            type: string
            example: "camera_control"
          data:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: "対象のカメラ。"
              action:
                type: string
                enum: [switch, start_stream, stop_stream]
                example: "switch"
              fov:
                type: number
              lookAt:
                type: string

      ManipulatorOpenResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          sessionId:
            type: string
            format: uuid
          width:
            type: integer
            example: 512
          height:
            type: integer
            example: 512
          aspect:
            type: number
            example: 1
          message:
            type: string

      ManipulatorCameraPoseRequest:
        type: object
        properties:
          yaw:
            type: number
            description: "周回のヨー角 (度)。絶対値。"
          pitch:
            type: number
            description: "周回のピッチ角 (度)。絶対値。"
          distance:
            type: number
            description: "注視点からの距離。絶対値。"
          focus:
            type: boolean
            description: "注視点を編集対象へ取り直す。ほかのフィールドと併用できます。"
          panDx:
            type: number
            description: >
              注視点を画面ピクセル単位で平行移動する量。右方向が正。現在の距離と画角からワールド
              単位へ換算します — シーンビューの中ボタンドラッグ相当です。
          panDy:
            type: number
            description: "注視点を画面ピクセル単位で平行移動する量。下方向が正。"

      InputActionInfo:
        type: object
        properties:
          name:
            type: string
            example: "ToggleCamera"
          bindings:
            type: array
            items:
              type: string
            example: ["<Keyboard>/f1"]
            description: "実効のコントロールパス。バインド順。"
          bindingDisplayNames:
            type: array
            items:
              type: string
            example: ["F1"]
            description: "`bindings` を人が読める形にしたもの。同じ順序。"
          isEnabled:
            type: boolean
            example: true
          actionType:
            type: string
            example: "Button"

      InputActionsListResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          actions:
            type: array
            items:
              $ref: "#/components/schemas/InputActionInfo"
          timestamp:
            type: string
            format: date-time

      InputActionBindResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
          actionName:
            type: string
            example: "ToggleCamera"
          bindingIndex:
            type: integer
            example: 0
          newBinding:
            type: string
            example: "<Keyboard>/f2"
          timestamp:
            type: string
            format: date-time
