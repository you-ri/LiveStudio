openapi: '3.1.1'
info:
  title: LiveStudio API
  version: '0.1'
  description: |
    `jp.lilium.livestudio` が [Remote Control API](../remotecontrol/index.md)
    の上に足す HTTP ルートです。`LiveStudioRemoteControl` が同じサーバー・同じポートへ登録するので、
    2 つ目のリスナーが立つわけではありません。

    ここにあるのは、汎用のライブオブジェクト面では表せない 2 種類だけです。

    - **バイナリ** — カメラのプレビュー、アバターのサムネイル、スナップショットのサムネイル、
      マニピュレーターのフレーム
    - **状態を持つ / 時間がかかる** — VRM の読み込み、マニピュレーターのセッション保持、
      入力アクションの再バインド

    ただの値であるもの (ライトの明るさ、カメラの画角、表情のウェイト) は*ここにはありません*。
    それらは公開プロパティで、`GET|PUT /live/object/{id}/{path}` から読み書きします。汎用側で
    足りないときにだけ、このリファレンスを見てください。

    ここのルートもすべて `/live/` の下にあります。このパッケージは特定のアプリに依存しない
    汎用基盤で、ホストアプリとルートテーブルを共有するため、`camera` や `assets` のような
    一般名を `/api/` 側で押さえないようにしています。`/api/` は組み込む側のアプリのために
    空けてあります (詳細は Remote Control API の「名前空間」)。

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: '3002'
        description: >
          アプリの RemoteControl サーバーが待ち受けるポート。3002 はパッケージ既定値で、
          出荷される LiveStudio アプリでは上書きされているのが普通です。

tags:
  - name: カメラ
    x-slug: camera
    description: カメラの一覧、ライブカメラの切り替え、プレビュー画像。
  - name: アバター
    x-slug: avatar
    description: VRM の読み込み、サムネイル、表情の一覧。
  - name: アセット
    x-slug: assets
    description: >
      参照スロットに何を差せるかを調べる口。返るのは統一アセットキーです — ベイク済みや
      組み込みのアセットは素の GUID、外部パックのメンバーは `file:<path>#<name>` です。
  - name: スナップショット
    x-slug: snapshot
    description: 保存済みスナップショットのサムネイル。
  - name: マニピュレーター
    x-slug: manipulator
    description: >
      リモートアプリの Transform ギズモを支えるオフスクリーンカメラ。1 つのプロパティに対して
      セッションを開き、ドラッグ中はフレームをポーリングし、終わったら閉じます。
  - name: 入力
    x-slug: input
    description: ランタイムのキーバインドと、対話的な再バインド。

x-tagGroups:
  - name: シーン
    tags: [カメラ, アバター, スナップショット]
  - name: オーサリング
    tags: [アセット, マニピュレーター, 入力]

paths:
  # ---------------------------------------------------------------- カメラ
  /live/camera:
    get:
      tags: [カメラ]
      summary: カメラを一覧する
      responses:
        '200':
          description: シーン上のすべてのカメラ。ライブのものには印が付きます。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraListResponse"
    post:
      tags: [カメラ]
      summary: カメラを操作する
      description: >
        本文に動詞を入れる形の 1 本口で、ただのプロパティではない操作のために残しています。
        画角や注視先は通常の公開プロパティなので、それらは
        `PUT /live/object/{cameraId}/{path}` を使ってください。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraControlRequest"
      responses:
        '200':
          description: 操作が適用されたかどうか。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        '400':
          description: 本文が不正、または `data` がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/camera/switch:
    post:
      tags: [カメラ]
      summary: カメラをライブにする
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cameraId]
              properties:
                cameraId:
                  type: string
                  format: uuid
                  example: "2e910ddf-8cd8-4fb2-92f3-44b1ccd20c5f"
      responses:
        '200':
          description: 切り替えた。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        '400':
          description: "`cameraId` がない、または解釈できない。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/camera/image:
    get:
      tags: [カメラ]
      summary: カメラのプレビュー画像を取得する
      description: >
        そのカメラを 1 回レンダリングし、アスペクト比を保った縮小 PNG を返します。プレビューは
        これをポーリングして作ります。ストリームはありません。
      parameters:
        - in: query
          name: camera
          required: false
          schema:
            type: string
            format: uuid
          description: "カメラ id。省略するとライブのカメラを撮ります。"
      responses:
        '200':
          description: 画像。
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: そのカメラがない、またはまだ画像が無い。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- アバター
  /live/vrm/load:
    post:
      tags: [アバター]
      summary: VRM ファイルをアバターとして読み込む
      description: >
        読み込みが受け付けられた時点で応答します。完了は待ちません。大きな VRM は数秒かかり、
        その間リクエストで接続を掴んでいるわけにはいかないためです。進捗と完了は
        `vrm_load_*` イベントとして受信箱 (`GET /live/events`) に届きます。読み込み中に接続してきた
        クライアントにも、名乗った時点で知らされます。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filePath]
              properties:
                filePath:
                  type: string
                  example: "C:/Users/me/Documents/avatars/mine.vrm"
      responses:
        '200':
          description: 読み込みを受け付けて開始した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        '400':
          description: 本文が空、`filePath` がない、または VRM として受け付けられないパス。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/vrm/reset:
    post:
      tags: [アバター]
      summary: 現在のアバターを降ろす
      responses:
        '200':
          description: アバターをリセットした。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"

  /live/avatar/image:
    get:
      tags: [アバター]
      summary: アセットのサムネイルを取得する
      description: >
        アバターに限らず、登録済みのどのアセットのプレビュー画像も返します (パス名は一般化する前の
        名残で、そのまま残しています)。VRM/glb は初回リクエスト時に埋め込みサムネイルを抽出して
        キャッシュします。バンドルのサムネイルはバンドルを読み込んだときにキャッシュされるので、
        **一度は読み込まれた後**でないと出ません。キャッシュはディスク上にあるので、再起動しても
        残ります。
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
          description: >
            アセットの id または参照。セッション内の id と、永続化されたプロジェクト相対の参照の
            どちらでも解決します。
      responses:
        '200':
          description: サムネイル。
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: そのアセットが無い、または (まだ) サムネイルが無い。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/expressions:
    get:
      tags: [アバター]
      summary: 現在のアバターの表情を一覧する
      description: >
        ウェイトの現在値は**ここからは流れません**。ウェイトは通常の公開プロパティ
        (`expressions[<name>].weight`) なので、表示中プロパティの同期に乗ります — 表情カードが
        画面に出ているあいだだけ、それを見ているクライアントにだけ届きます。
      responses:
        '200':
          description: >
            使える表情。空のときは、アバターが読み込まれていないか、表情を公開していません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressionListResponse"
    post:
      tags: [アバター]
      summary: 表情のウェイトを設定する
      description: >
        公開プロパティへの書き込みと等価で、アバターオブジェクトを持たずに名前で表情を指したい
        クライアントのために残しています。`PUT /live/object/{avatarId}/expressions[<name>]/weight`
        を優先してください。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressionControlRequest"
      responses:
        '200':
          description: >
            結果。拒否された場合 (アバターがいない、未知の action、名前がない) も 200 で返り、
            `success: false` になる点に注意してください。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressionControlResponse"
        '400':
          description: 本文が不正、または `data` がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- アセット
  /live/assets:
    get:
      tags: [アセット]
      summary: 参照スロットに差せるアセットを一覧する
      description: >
        絞り込みの軸は 2 つあり、組み合わせられます。応答の形はどちらでも同じなので、クライアントは
        どちらを使ったかを意識する必要がありません。


        `type` — その型のアセットを 1 枚の平坦なカタログにして、ベイク済み・組み込み・外部を区別せず
        並べます。外部パックは一覧を作る前に一度だけ開かれます (以降キャッシュ)。パック名からは中身の
        種類が分からないので、「この型なら開かなくてよい」という判断ができないためです。結果として、
        セッション最初の 1 回だけが重くなります。


        `pack` — 特定のパック 1 つを開いて中身を掘る 2 段目です。ユーザーがそのパックに実際に踏み込んだ
        ときだけ使います (例: プロジェクトのアセット一覧で行を展開する)。開くのはそのパックだけなので、
        カタログ全体の事前展開のコストは払いません。一覧する行為がメンバーの登録も兼ねるので、その後の
        選択ではパックを読み直さずに解決できます。
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
          example: "AnimationClip"
          description: "アセットの型名。省略すると登録済みのすべてを返します。"
        - in: query
          name: pack
          required: false
          schema:
            type: string
          description: >
            アセットパックの id。指定するとそのパックのメンバーだけを一覧します。`type` と併用すると
            パック内をさらに型で絞り込めます。
      responses:
        '200':
          description: カタログ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
        '404':
          description: >
            `pack` の id が不明、またはそのアセットがパックではない。`type` が何にも一致しない場合は
            エラーではなく空のカタログです。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: パックを開けなかった。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- スナップショット
  /live/snapshot/image:
    get:
      tags: [スナップショット]
      summary: スナップショットのサムネイルを取得する
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
          example: "take-03"
          description: "スナップショット名。スナップショットのライブオブジェクトが列挙するもの。"
      responses:
        '200':
          description: サムネイル。
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: そのスナップショットが無い、または画面キャプチャなしで保存された。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- マニピュレーター
  /live/manipulator/open:
    post:
      tags: [マニピュレーター]
      summary: マニピュレーターのセッションを開く
      description: >
        オフスクリーンカメラを、Transform 値を持つプロパティ 1 つに結び付けます。返ってくる
        `sessionId` が、以降のマニピュレーター呼び出しすべてのハンドルです。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectId]
              properties:
                objectId:
                  type: string
                  example: "3470a41c-f079-4d30-a002-3468fda088f7"
                propertyPath:
                  type: string
                  example: "transform"
                  description: "編集対象のプロパティ。オブジェクト自身の transform なら省略。"
      responses:
        '200':
          description: セッションと、これから返るフレームの大きさ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManipulatorOpenResponse"
        '400':
          description: 本文が空、または `objectId` がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: そのオブジェクトが無い、またはこの方式で編集できないプロパティ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [マニピュレーター]
      summary: マニピュレーターのセッションを閉じる
      description: "冪等です。すでに閉じた (または不明な) セッションでも 204 を返します。"
      parameters:
        - $ref: "#/components/parameters/ManipulatorSession"
      responses:
        '204':
          description: 閉じた。

  /live/manipulator/image:
    get:
      tags: [マニピュレーター]
      summary: マニピュレーターのフレームを、そのカメラ状態と一緒に取得する
      description: >
        PNG だけではギズモを重ねて描けません。そのフレームがどの行列で描かれたかが要ります。
        別リクエストにせず `X-Manipulator-State` レスポンスヘッダーに同乗させているので、画像と
        状態が食い違うことは原理的に起きません。

        ヘッダーの中身は UTF-8 JSON を base64 にしたものです。

        ```json
        {
          "view":       [16 個の float, 列優先],
          "projection": [16 個の float, 列優先],
          "parent":     { "position": {x,y,z}, "rotation": {x,y,z,w}, "scale": {x,y,z} },
          "target":     { "position": {x,y,z}, "rotation": {x,y,z,w}, "scale": {x,y,z} },
          "viewport":   { "width": 512, "height": 512 }
        }
        ```

        `parent` は編集対象の親のワールド変換、`target` は対象自身のローカル変換です。
        `Access-Control-Expose-Headers` を付けてあるので、ブラウザからでもクロスオリジンで
        ヘッダーを読めます。
      parameters:
        - $ref: "#/components/parameters/ManipulatorSession"
      responses:
        '200':
          description: フレーム。カメラ状態は `X-Manipulator-State` に入っています。
          headers:
            X-Manipulator-State:
              description: "このフレームちょうどのカメラ状態。base64(UTF-8(JSON))。"
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: セッションが不明、または閉じている。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: キャプチャに失敗した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/manipulator/camera:
    put:
      tags: [マニピュレーター]
      summary: マニピュレーターのカメラを動かす
      description: >
        すべてのフィールドが任意で、同時に指定すれば合成されます。今の操作で変わった分だけを
        送ってください。結果を見るには、その後フレームを取り直します。
      parameters:
        - $ref: "#/components/parameters/ManipulatorSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManipulatorCameraPoseRequest"
      responses:
        '204':
          description: 適用した。
        '400':
          description: 本文が空、または不正。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: セッションが不明、または閉じている。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- 入力
  /live/input-actions:
    get:
      tags: [入力]
      summary: ランタイムの入力アクションとバインドを一覧する
      responses:
        '200':
          description: 有効なアクションマップに属するすべてのアクション。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputActionsListResponse"

  /live/input-actions/bind:
    post:
      tags: [入力]
      summary: 入力アクションを対話的に再バインドする
      description: >
        対話的な再バインドを開始します。アプリはユーザーが次に動かしたコントロールを待ち受け、
        それを割り当てます。レスポンスは、実際に取り込まれたバインドを報告します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionName]
              properties:
                actionName:
                  type: string
                  example: "ToggleCamera"
                bindingIndex:
                  type: integer
                  example: 0
                  description: "そのアクションの何番目のバインドを置き換えるか。"
      responses:
        '200':
          description: >
            結果。開始できなかった場合 (アクションが無い、すでに待ち受け中) も 200 で返り、
            `success: false` になります。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputActionBindResponse"
        '400':
          description: 本文が不正、または `actionName` がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    ManipulatorSession:
      in: query
      name: session
      required: true
      schema:
        type: string
        format: uuid
      description: "`POST /live/manipulator/open` が返したセッション id。"

  schemas:
      ErrorResponse:
        type: object
        properties:
          error:
            type: string
            example: "Session not found."

      CommandResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: "Camera switched."
          timestamp:
            type: string
            format: date-time

      CameraApiInfo:
        type: object
        properties:
          id:
            type: string
            format: uuid
            example: "2e910ddf-8cd8-4fb2-92f3-44b1ccd20c5f"
          name:
            type: string
            example: "Front"
          isLive:
            type: boolean
            example: true
            description: "いま出力に使われているカメラなら true。"
          fov:
            type: number
            example: 35
          aspect:
            type: number
            example: 1.7777778
          lookAt:
            type: string
            example: "Head"

      CameraListResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          cameras:
            type: array
            items:
              $ref: "#/components/schemas/CameraApiInfo"
          timestamp:
            type: string
            format: date-time

      CameraControlRequest:
        type: object
        required: [data]
        properties:
          type:
            type: string
            example: "camera_control"
          data:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: "対象のカメラ。"
              action:
                type: string
                enum: [switch, start_stream, stop_stream]
                example: "switch"
              fov:
                type: number
              lookAt:
                type: string

      ExpressionApiInfo:
        type: object
        properties:
          name:
            type: string
            example: "Joy"
          displayName:
            type: string
            example: "Joy"
          isPreset:
            type: boolean
            example: true
            description: "VRM 標準の表情なら true、アバター固有なら false。"
          weight:
            type: number
            example: 0

      ExpressionListResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          availableExpressions:
            type: array
            items:
              $ref: "#/components/schemas/ExpressionApiInfo"
          timestamp:
            type: string
            format: date-time

      ExpressionControlRequest:
        type: object
        required: [data]
        properties:
          type:
            type: string
            example: "expression_control"
          data:
            type: object
            required: [action, expressionName]
            properties:
              action:
                type: string
                enum: [set_weight]
                example: "set_weight"
              expressionName:
                type: string
                example: "Joy"
              weight:
                type: number
                example: 1

      ExpressionControlResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: "Expression weight set to 1"
          expressionName:
            type: string
            example: "Joy"
          action:
            type: string
            example: "set_weight"
          timestamp:
            type: string
            format: date-time

      AssetListResponse:
        type: object
        properties:
          type:
            type: string
            example: "AnimationClip"
            description: "要求された型のエコー (指定が無ければ空)。"
          assets:
            type: array
            items:
              type: object
              properties:
                key:
                  type: string
                  example: "file:Assets/Packs/dances.pack.lsb#Wave"
                  description: >
                    統一アセットキー。アセット参照プロパティへは、これをそのまま書き込みます。
                name:
                  type: string
                  example: "Wave"
                type:
                  type: string
                  example: "AnimationClip"

      ManipulatorOpenResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          sessionId:
            type: string
            format: uuid
          width:
            type: integer
            example: 512
          height:
            type: integer
            example: 512
          aspect:
            type: number
            example: 1
          message:
            type: string

      ManipulatorCameraPoseRequest:
        type: object
        properties:
          yaw:
            type: number
            description: "周回のヨー角 (度)。絶対値。"
          pitch:
            type: number
            description: "周回のピッチ角 (度)。絶対値。"
          distance:
            type: number
            description: "注視点からの距離。絶対値。"
          focus:
            type: boolean
            description: "注視点を編集対象へ取り直す。ほかのフィールドと併用できます。"
          panDx:
            type: number
            description: >
              注視点を画面ピクセル単位で平行移動する量。右方向が正。現在の距離と画角からワールド
              単位へ換算します — シーンビューの中ボタンドラッグ相当です。
          panDy:
            type: number
            description: "注視点を画面ピクセル単位で平行移動する量。下方向が正。"

      InputActionInfo:
        type: object
        properties:
          name:
            type: string
            example: "ToggleCamera"
          bindings:
            type: array
            items:
              type: string
            example: ["<Keyboard>/f1"]
            description: "実効のコントロールパス。バインド順。"
          bindingDisplayNames:
            type: array
            items:
              type: string
            example: ["F1"]
            description: "`bindings` を人が読める形にしたもの。同じ順序。"
          isEnabled:
            type: boolean
            example: true
          actionType:
            type: string
            example: "Button"

      InputActionsListResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          actions:
            type: array
            items:
              $ref: "#/components/schemas/InputActionInfo"
          timestamp:
            type: string
            format: date-time

      InputActionBindResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
          actionName:
            type: string
            example: "ToggleCamera"
          bindingIndex:
            type: integer
            example: 0
          newBinding:
            type: string
            example: "<Keyboard>/f2"
          timestamp:
            type: string
            format: date-time
