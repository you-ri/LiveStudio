openapi: '3.1.1'
info:
  title: Remote Control API
  version: '0.3'
  description: |
    `jp.lilium.remotecontrol` が提供する HTTP インターフェースです。動作中の Unity アプリを
    REST サーバーに変えます。*ライブオブジェクト* として登録されたものは、プロセスの外から
    列挙・読み書き・呼び出しができ、アプリ自身の状態 (接続・言語・パフォーマンス・シーンファイル・
    サイドメニュー) も少数の固定エンドポイントから届きます。

    このリファレンスが収録するのは **RemoteControl パッケージ自身が登録するルートだけ**です。
    ほかのパッケージが足すルートは、それぞれのリファレンスにあります。

    - **LiveStudio** — カメラ、アバター、スナップショット、マニピュレーター、入力アクション
    - **Virgo Extension** — キャプチャー状態、デバイス情報、キャリブレーション

    ## 名前空間

    このパッケージが登録するルートはすべて `/live/` の下にあります。

    RemoteControl はライブラリで、自分のハンドラとホストアプリのハンドラが同じサーバー・同じ
    ルートテーブルを共有します。ここでライブラリが `status` のような一般名をルートの根元で取ると、
    その名前はアプリ側が二度と使えなくなります。だから提供するものは `/live/` に寄せ、**それ以外の
    プレフィックスは組み込む側のアプリのために空けてあります**。

    同じ理由で `jp.lilium.livestudio` も `/live/` を使います。VirgoMotion の各アプリ
    (Studio / Fusion / Capture) は自分のルートも `/live/` に載せていますが、これは同じ開発元が
    出荷するスタック全体を 1 つのプレフィックスに揃えているためです。第三者がこのパッケージを
    組み込むときは、自分のプレフィックスを決めてそこにルートを置いてください。

    `/live/` 直下はこのパッケージの予約領域です。どうしても `/live/` に足したいときは
    `/live/app/*` のように 1 段掘って、将来ライブラリが同じ名前を取っても当たらないように
    してください。

    ## 約束ごと

    - 明記のない限りレスポンスはすべて JSON です (画像は `image/png`)。
    - エラーは `{ "error": "<メッセージ>" }` を返し、種別はステータスコードで表します。
    - `X-Client-ID` が呼び出し元の識別子です。クライアントごとに安定した値を送ってください。
      受信箱・接続の存在確認・確認ダイアログの宛先が、すべてこのキーで引かれます。
      省略すると `<アドレス>:<ポート>` にフォールバックしますが、これは再接続をまたいで
      安定しません。
    - **push はありません。** クライアントは `GET /live/changes` で「どのオブジェクトが変わったか」
      だけを受け取り、自分が表示しているものだけ取り直します。それらのポーリングと取り直しは
      `POST /live/batch` に束ねて 1 往復にできます。

    ## ポート

    既定では **3002** で待ち受けます。組み込んだアプリ側で上書きするのが普通なので、実際の
    ポートはアプリの RemoteControl 設定を確認してください。

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: '3002'
        description: アプリの RemoteControl サーバーが待ち受けるポート。3002 はパッケージ既定値。

tags:
  - name: セッション
    x-slug: session
    description: >
      接続確認、クライアントごとの受信箱、確認ダイアログへの回答。リモート側がアプリの中身を
      知る前に話しかける相手がここです。
  - name: ランタイム
    x-slug: runtime
    description: プロセス全体の状態 — パフォーマンス計測、UI 言語、終了とリセット。
  - name: 型
    x-slug: types
    description: >
      型テーブル。クライアントは最初に一度取得し (以降は `/live/changes` が擬似 id `@types` を
      報告したときに取り直し)、受け取ったプロパティや関数をどう描画するかを決めます。
  - name: オブジェクト
    x-slug: objects
    description: ライブオブジェクトの一覧・個別取得と、オブジェクト間の親子関係。
  - name: プロパティ
    x-slug: properties
    description: >
      ライブオブジェクトのプロパティ 1 つを読み書きします。配列プロパティも同じパスに
      POST (末尾追加) / DELETE (削除) / PATCH (並べ替え) で編集します。
  - name: 関数
    x-slug: functions
    description: ライブオブジェクトに公開されたメソッドの呼び出し。
  - name: 同期
    x-slug: sync
    description: 変更フィードとバッチ — クライアントが安く最新を保つための仕組み。
  - name: アセット
    x-slug: assets
    description: >
      アセットキーの解決と、スロットに差せる候補の一覧。


      ライブオブジェクトが「インスタンス」を扱うのと同じ位置で、こちらは「ファイル」を扱います。
      キーとアセットの台帳 (`AssetRegistry`) がこのパッケージのものなので、単数形も複数形もここに
      あります。台帳に載せる側 — キーの文法や、ファイルをどう開くか — は組み込むアプリの担当で、
      このパッケージは差し込まれた口を呼んでから台帳を読むだけです。
  - name: ライブシーン
    x-slug: live-scene
    description: >
      ライブシーン全体のファイルへの保存と読み込み、および参照先が存在しなくなった
      エントリの解決。
  - name: Web UI
    x-slug: web-ui
    description: >
      リモート UI の構成をアプリ側が宣言したもの。どのページがあり、何という名前で、アプリ自身が
      何と呼ばれているか。リモートアプリはナビゲーションをハードコードせず、これを見て描画します。

x-tagGroups:
  - name: アプリケーション
    tags: [セッション, ランタイム]
  - name: ライブオブジェクト
    tags: [型, オブジェクト, プロパティ, 関数, 同期]
  - name: アセット
    tags: [アセット]
  - name: ライブシーン
    tags: [ライブシーン]
  - name: Web UI
    tags: [Web UI]

paths:
  # ---------------------------------------------------------------- セッション
  /live/status:
    get:
      tags: [セッション]
      summary: 接続を確認し、自分を「居る」ものとして登録する
      description: >-
        呼び出し元 (X-Client-ID) を接続中として記録します。確認ダイアログを出す先が
        あるかどうかを、アプリはこれで判断しています。レスポンスの instanceId はサーバーが
        建て直されるたびに変わります。値が変わったのを見たクライアントは、手元の
        カーソルとキャッシュをすべて捨ててください。
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        '200':
          description: アプリの識別情報と、この起動のインスタンス id。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /live/events:
    get:
      tags: [セッション]
      summary: このクライアント宛に溜まった 1 回限りの通知を受け取る
      description: >-
        通知や確認ダイアログは push されず、クライアント (X-Client-ID) ごとに積まれます。
        前回のレスポンスの lastEventId を `since` に渡すと、その続きだけが返ります。
        リモートアプリはこれを /live/batch のサブリクエストとして送るので、往復は増えません。
      parameters:
        - $ref: "#/components/parameters/ClientId"
        - in: query
          name: since
          required: false
          schema:
            type: integer
            format: int64
          description: "前回のレスポンスが返した読み取り位置。省略または 0 で、溜まっている分をすべて受け取る。"
      responses:
        '200':
          description: "`since` より後に積まれたイベントと、新しい読み取り位置。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"

  /live/confirm:
    post:
      tags: [セッション]
      summary: アプリが出した確認ダイアログに回答する
      description: >
        アプリは「未保存の変更を破棄するか」といった問いを、接続中のすべてのリモートへ同時に
        出せます。回答はそれらの競争になるので、すでに決着した id や存在しない id を POST しても
        エラーではありません。`settled: false` が返るので、クライアントは自分のモーダルを
        閉じるだけで構いません。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        '200':
          description: この回答が決着させたものかどうか。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResponse"
        '400':
          description: 本文が不正、または id がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- ランタイム
  /live/performance:
    get:
      tags: [ランタイム]
      summary: フレームレートとメモリ使用量を計測する
      description: >
        /live/status とは別にしてあります。表示しているあいだだけ支払えばよくするためです
        (パフォーマンス表示は、それが見えているときだけこれをポーリングします)。
      responses:
        '200':
          description: 1 サンプル分。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceResponse"

  /live/language:
    get:
      tags: [ランタイム]
      summary: 現在の UI 言語と、選べる言語の一覧を取得する
      responses:
        '200':
          description: 現在の言語と選択肢。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageResponse"
    put:
      tags: [ランタイム]
      summary: UI 言語を切り替える
      description: >
        アプリ自身のローカライズと、以降サーバーが返す翻訳済みの文字列 (ヘルプ文、サイドメニューの
        ラベル) の両方に効きます。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language:
                  type: string
                  example: "ja"
      responses:
        '200':
          description: 切り替わった後の言語。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  current: { type: string, example: "ja" }
        '400':
          description: "`language` がない、または空。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/commands/quit:
    post:
      tags: [ランタイム]
      summary: アプリケーションの終了を要求する
      description: >
        即座に応答し、その少し後に終了します (終了処理中のプロセスに応答を待たせないため)。
        アプリ側が終了を保留することもあります。未保存の変更があれば先に確認ダイアログが上がり、
        回答後に改めて終了が要求されます。したがってこの 200 は「要求を受け付けた」であって
        「終了した」ではありません。
      responses:
        '200':
          description: 終了処理を開始した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"

  /live/commands/reset:
    post:
      tags: [ランタイム]
      summary: 保存された設定を消して再起動する
      description: >
        アプリの保存済み設定と RemoteControl のデータを削除してから終了します。ローカル設定が
        壊れたときの復旧手段です。
      responses:
        '200':
          description: リセットを開始した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"

  # ---------------------------------------------------------------- 型
  /live/types:
    get:
      tags: [型]
      summary: すべてのライブオブジェクト型の型テーブルを取得する
      description: >
        各型のプロパティ (名前・型・読み取り専用・配列かどうか・表示コントローラー) と、呼び出せる
        関数を記述します。クライアントは一度取得すれば、その型のすべてのオブジェクトに使い回せます。
        取り直しが要るときは `/live/changes` が擬似 id `@types` を報告します。
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
          example: "Camera"
          description: "任意: 型名で絞り込む。省略時はすべての型を返す。"
      responses:
        '200':
          description: 要求された型の記述。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesGettingResponse"

  /live/type/{name}:
    get:
      tags: [型]
      summary: 型定義を 1 件取得する
      description: >
        複数形 `/live/types` に対する単数形で、`/live/objects` と `/live/object/{id}` の関係と
        同じです。返すのは `/live/types` の配列要素そのもので、配列には包みません。名前は識別子
        (スラッシュを含まない) なのでパスに置けます — 資産キーがパスに置けずクエリなのとは対照的です。

        すでに全型テーブルを持っているクライアントには不要です。`/live/changes` が擬似 id
        `@types` を報告したあと、手元に無い 1 型だけを取り直すような用途を想定しています。
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          example: "Camera"
          description: "型名。`/live/types` の `type` フィールドと同じ綴り。"
      responses:
        '200':
          description: 型定義。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypeDefinition"
        '404':
          description: >
            その名前の型は公開されていない。**一覧側との違いに注意**: `/live/types?type=` は
            無一致でも 200 + 空集合を返します。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/enums:
    get:
      tags: [型]
      summary: 公開された列挙型の値テーブルを取得する
      description: >
        enum 型のプロパティは名前だけで流れるので、選択肢を提示するにはこれが要ります。アプリの外で
        宣言された enum (`[assembly: ExposedExternalEnum]` で登録したもの) も含みます。
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
          example: "CameraProjection"
          description: "任意: 型名で絞り込む。省略時は公開されたすべての enum を返す。"
      responses:
        '200':
          description: 要求された enum の記述。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnumsGettingResponse"

  /live/enum/{name}:
    get:
      tags: [型]
      summary: enum 定義を 1 件取得する
      description: >
        `/live/type/{name}` の enum 版。複数形 `/live/enums` に対する単数形で、返すのは
        その配列要素そのものです。
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          example: "CameraProjection"
          description: "enum 型名。`/live/enums` の `type` フィールドと同じ綴り。"
      responses:
        '200':
          description: enum 定義。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnumDefinition"
        '404':
          description: その名前の enum は公開されていない (一覧側は無一致でも 200 + 空集合)。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- オブジェクト
  /live/objects:
    get:
      tags: [オブジェクト]
      summary: ライブオブジェクトを一覧する
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
          example: "Light"
          description: "任意: 型で絞り込む。省略時はすべてのオブジェクトを返す。"
        - in: query
          name: category
          required: false
          schema:
            type: string
          example: "Avatar"
          description: >
            任意: オブジェクトの型が宣言したカテゴリで絞り込む。サイドメニューの各ページが、
            そのページに属するオブジェクトだけを出すのに使います。照合されるのは**宣言された
            文字列**で、`/live/types` が返す翻訳済みラベルではありません。UI の表示ではなく
            カテゴリキーを渡してください。`type` より優先されます (両方指定すると `type` は無視)。
        - $ref: "#/components/parameters/Nested"
      responses:
        '200':
          description: 一致したオブジェクトを、要求された深さでシリアライズしたもの。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectsGettingResponse"

  /live/object/{id}:
    get:
      tags: [オブジェクト]
      summary: ライブオブジェクト 1 つを全プロパティ付きで取得する
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/Nested"
      responses:
        '200':
          description: 要求された深さのオブジェクト。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectGettingResponse"
        '404':
          description: その id のオブジェクトがない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/object/{id}/@parent:
    put:
      tags: [オブジェクト]
      summary: ライブオブジェクトの親を付け替える
      description: >
        `@parent` は擬似プロパティです。型テーブルには載っておらず、レジストリが持つ親子関係
        そのものを指します。`null` を渡すとルート直下へ切り離します。レスポンスは付け替えた後の
        オブジェクトを完全展開したものです。
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId:
                  type: [string, "null"]
                  example: "e79efd50-5ea6-4cc0-a7a7-49110eb3b0da"
                  description: "新しい親の id。ルートへ移すときは null。"
      responses:
        '200':
          description: 付け替えた後のオブジェクト。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectGettingResponse"
        '400':
          description: 移動が拒否された (親が存在しない、または循環する)。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- プロパティ
  /live/object/{id}/{path}:
    get:
      tags: [プロパティ]
      summary: プロパティを 1 つ取得する
      description: >
        常に完全展開 (深さ無制限) で返ります。パスの時点で応答が 1 本の枝に限定されているので、
        `nested` フラグはここでは効きません。`/live/objects` が省略した子を、必要になった時点で
        取りに行くのがこのエンドポイントです。


        **絵のメンバー**: 宣言が ImagePreview のメンバー (カメラの `preview` など) は、
        JSON ではなく画像そのもの (`image/png` 等のバイナリ) で応答します。オブジェクト全体や
        `/live/batch` の JSON 読みには、そのメンバー自身のこのアドレスが値として載るので、
        クライアントは値の URL をポーリングするだけでプレビューを描けます。絵が無いときは
        404 (プレースホルダへのフォールバック合図)。
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/PropertyPath"
      responses:
        '200':
          description: >
            プロパティの値と、それがどこにあるか。絵のメンバーは画像バイナリ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyGettingResponse"
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: そのオブジェクトまたはプロパティがない。絵のメンバーはまだ絵が無い場合も。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [プロパティ]
      summary: プロパティを 1 つ書き換える
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/PropertyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertySettingRequest"
      responses:
        '200':
          description: オブジェクトから読み直した、書き込み後の値。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyGettingResponse"
        '400':
          description: 値をプロパティの型へ変換できなかった。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [プロパティ]
      summary: 配列プロパティの末尾に要素を追加する
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/PropertyPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertySettingRequest"
        description: >
          本文を省略すると既定値の要素を追加します。要素型が多態なら
          `{ "value": { "@type": "<型名>" } }` で具象型を指定します。
      responses:
        '200':
          description: 追加した後の配列。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyGettingResponse"

    delete:
      tags: [プロパティ]
      summary: 配列プロパティから要素を削除する
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/PropertyPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyDeleteRequest"
      responses:
        '200':
          description: 削除した後の配列。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyGettingResponse"

    patch:
      tags: [プロパティ]
      summary: 配列プロパティの要素を並べ替える
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/PropertyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyReorderRequest"
      responses:
        '200':
          description: 移動した後の配列。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyGettingResponse"

  /live/object/{id}/{path}/@reset:
    post:
      tags: [プロパティ]
      summary: プロパティを既定値へ戻す
      description: >
        既定値とは、そのオブジェクトが最初に登録されたときにプロパティが持っていた値です。
        プロパティ応答の `changed` が比較しているのも、この値です。


        末尾の `@reset` は**疑似メンバー**で、オブジェクトの `@parent` と同じ綴り方です。素の
        `reset` だと、`reset` という名前のメンバーへの配列追加 (`POST /live/object/{id}/reset`) と
        区別が付きません。`@` で始まる名前は実在のメンバー名と衝突しないため、この 1 文字が
        「実在するプロパティか、プロパティに対する操作か」を分けています。
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/PropertyPath"
      responses:
        '200':
          description: 戻した後のプロパティ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyGettingResponse"

  # ---------------------------------------------------------------- 関数
  /live/function/{id}/{path}:
    post:
      tags: [関数]
      summary: ライブオブジェクトの関数を呼び出す
      description: >
        `path` は関数名を小文字にしたもので、ぶら下がっているプロパティパスを前に付けられます
        (例: `controller/resetyawangle`)。引数は本文に入れます。引数のない関数なら本文は不要です。
        戻り値は `void` も含めて `result` に入って返ります。
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - in: path
          name: path
          required: true
          schema:
            type: string
          example: "toggle"
          description: "関数名 (小文字)。前にプロパティパスを付けられる。"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                args:
                  type: array
                  items: {}
                  description: "宣言順に並べた引数。"
                  example: ["Camera 1"]
      responses:
        '200':
          description: 戻り値。
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    description: "関数の戻り値。void なら null。"
        '404':
          description: そのオブジェクトまたは関数がない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- 同期
  /live/changes:
    get:
      tags: [同期]
      summary: ある revision 以降に変化したライブオブジェクトの id を取得する
      description: >
        プロパティの変化は push されません。サーバーが記録するのは変化したオブジェクトの id だけで、
        クライアントはこれをポーリングし、自分が実際に持っているオブジェクトだけを取り直します。
        見ていないページのデータが誰にも流れないのは、このためです。`since` を省略すると、現在の
        revision と空の変更リストが返ります。接続直後に、それまでの全 id を渡されることなく
        同期を合わせるための形です。擬似 id `@types` と `@ui` は、それぞれ「型テーブルを取り直せ」
        「サイドメニューを取り直せ」を意味します。
      parameters:
        - in: query
          name: since
          required: false
          schema:
            type: integer
            format: int64
          example: 57
          description: "任意: クライアントが最後に見た revision。省略すると同期合わせのみ。"
      responses:
        '200':
          description: "現在の revision と、`since` より後に変化した id。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesResponse"

  /live/batch:
    post:
      tags: [同期]
      summary: 複数の操作を 1 リクエストにまとめて適用する
      description: >
        各サブリクエストは順に、同一フレーム内で適用されます。項目どうしは独立していて、1 つ失敗しても
        残りは中断されません (continue-on-error)。全体のレスポンスは常に 200 で、成否は項目ごとの
        status が持ちます。

        受け付けるサブリクエストのパス:

        - `GET /live/events` — クライアントごとの受信箱
        - `GET /live/changes` — 変更フィード
        - `GET|PUT|POST|DELETE|PATCH /live/object/{id}/{path}` (`.../@reset` を含む)
        - `POST /live/function/{id}/{path}`

        リモートアプリが、変更フィードのポーリング・受信箱の回収・画面に出ているプロパティの更新を
        1 往復で済ませられるのは、これがあるためです。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        '200':
          description: リクエストと同じ順に並んだ項目ごとの結果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"

  # ---------------------------------------------------------------- アセット
  /live/asset/{key}:
    get:
      tags: [アセット]
      summary: アセットキーから表示用の情報を引く
      description: >
        アセット型のプロパティはキーだけで流れるので、ラベルを出すにはこれが要ります。キーは
        ベイク済みの GUID でも、外部参照の `file:<path>#<name>` でも、エンジンのアセットパス
        (`/Game/Props/Chair.Chair`) でも構いません。読み込み済みなら本当の名前と型が、未読み込みの
        外部キーでもキーから導いた名前が (型は空で) 返ります。


        単数形であることに注意してください。こちらはキー 1 つの解決だけを行います。選択肢の**一覧**は
        [`GET /live/assets`](#get-live-assets) です。


        **キーは URL の末尾を丸ごと占めます。** `/live/object/{id}/{path}` の `path` と同じ扱いで、
        キーの中の `/` は区切りのまま送ってください (`/live/asset/file:C:/props/chair.lsb`)。`/` で
        始まるキーはスラッシュが 2 つ並ぶ形になります (`/live/asset//Game/Props/Chair.Chair`)。
        これで正しく、サーバーはそのまま受け取ります。


        ⚠ **クライアント側でエスケープが要ります。** `#` と `?` は必ず percent-encode してください
        (`#` を生で送るとそこから先が fragment として切られ、サーバーに届きません)。キーに含まれる
        リテラルな `%` も `%25` にします。`/` はエスケープしません。


        ⚠ キーの途中に `..` があると、URL の正規化で別のキーに書き換わります。
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          example: "b1f2c3d4e5f60718293a4b5c6d7e8f90"
          description: "解決したいアセットキー。`/` を含んだまま複数セグメントに跨って構いません。"
      responses:
        '200':
          description: アセットの表示用情報。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetInfoResponse"
        '400':
          description: キーが空。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: キーが何にも解決できない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/assets:
    get:
      tags: [アセット]
      summary: スロットに差せるアセットを一覧する
      description: >
        単数形の `/live/asset/{key}` がクライアントの持っているキーを解決するのに対し、こちらは**どんなキーが
        あるか**を知るための口です。絞り込みの軸は 2 つあり、組み合わせられます。応答の形はどちらでも
        同じなので、クライアントはどちらを使ったかを意識する必要がありません。


        `type` — その型の登録済みアセットを 1 枚の平坦なカタログにします。ファイルを開くまで登録され
        ないアセットは、そのままでは抜け落ちます。そこで一覧の前に組み込み側のアプリへ「台帳を満たす」
        機会を渡します (LiveStudio ならアセットパックを一度だけ全部開く。以降キャッシュされるので、
        重いのはセッション最初の 1 回だけです)。


        `group` — 複数のアセットを抱えたファイルやバンドル 1 つ (LiveStudio ならアセットパック) を開いて
        中身を掘る 2 段目です。ユーザーが実際にそこへ踏み込んだときだけ使うので、カタログ全体の事前展開の
        コストは払いません。開く行為がメンバーの登録も兼ねるため、その後の選択では開き直さずに解決でき
        ます。どの口も知らないキーは 404 です (`type` が何にも一致しない場合はエラーではなく空カタログ)。
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
          example: "AnimationClip"
          description: "アセットの型名。省略すると登録済みのすべてを返します。"
        - in: query
          name: group
          required: false
          schema:
            type: string
          description: >
            まとまりのキー。指定するとその中のメンバーだけを一覧します。`type` と併用すると、
            まとまりの中をさらに型で絞り込めます。
      responses:
        '200':
          description: カタログ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
        '404':
          description: "`group` のキーを解決できるものが無い。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: まとまりを開けなかった。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/asset/{key}/@image:
    get:
      tags: [アセット]
      summary: アセットのサムネイルを取得する
      description: >
        名前と型を返す [`GET /live/asset/{key}`](#get-live-asset-key) の**絵**版です。アセットの種別は
        問いません。絵そのものを用意するのは組み込み側のアプリで、この口はその受け渡しだけを担います
        (供給する仕組みが無い構成では常に 404 になります)。


        キーが URL の末尾を占めるので、絵は**末尾の疑似メンバー** `@image` で区別します。オブジェクトの
        `@parent` と同じ綴り方です。`image` のような普通の語だと、キーの末尾がその語で終わったときに
        区別が付きません。キーのエスケープ規則は名前を引くときと同じです。


        LiveStudio の場合、VRM/glb は初回リクエスト時に埋め込みサムネイルを抽出してキャッシュし、
        バンドルのサムネイルはバンドルを読み込んだときにキャッシュされるので、**一度は読み込まれた
        後**でないと出ません。キャッシュはディスク上にあるので、再起動しても残ります。
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          description: >
            アセットの id または参照。文字列はそのまま組み込み側のアプリへ渡すので、対処表のキーでも
            アプリ独自の指し先でも構いません (LiveStudio ならセッション内の id と、永続化された
            プロジェクト相対の参照のどちらでも解決します)。
      responses:
        '200':
          description: サムネイル。
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: キーが空。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: そのアセットが無い、または (まだ) サムネイルが無い。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- ライブシーン
  /live/scene/export:
    post:
      tags: [ライブシーン]
      summary: ライブシーン全体をファイルへ書き出す
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenePathRequest"
      responses:
        '200':
          description: 書き出した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        '400':
          description: パスがない、または書き出しに失敗した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/scene/import:
    post:
      tags: [ライブシーン]
      summary: ライブシーンのファイルを読み込んで適用する
      description: >
        値は、すでに登録されているオブジェクトへ適用されます。参照先が存在しないものは捨てられず、
        保留エントリとして残ります (`GET /live/scene/orphans` を参照)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenePathRequest"
      responses:
        '200':
          description: 適用した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        '400':
          description: パスがない、またはファイルが存在しない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /live/scene/orphans:
    get:
      tags: [ライブシーン]
      summary: 参照先が存在しなくなったエントリを一覧する
      description: >
        現在のシーンが参照しているのに解決できないもの — 移動されたプロップファイル、削除された
        アバターなどです。黙って捨てずに残してあるので、クライアントは「Missing」として提示でき、
        ファイルを戻すか、エントリを消すかをユーザーが決められます。
      responses:
        '200':
          description: 未解決のエントリ。
          content:
            application/json:
              schema:
                type: object
                properties:
                  orphans:
                    type: array
                    items:
                      type: object
                      properties:
                        sourceKey:
                          type: string
                          example: "file:Assets/Props/chair.prop.lsb"
                        type:
                          type: string
                          example: "PropAsset"

  /live/scene/orphans/remove:
    post:
      tags: [ライブシーン]
      summary: 未解決の参照を捨てる
      description: >
        保留ストアからエントリを取り除きます。恒久的に消えるのは、この後シーンを保存したときです。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceKey]
              properties:
                sourceKey:
                  type: string
                  example: "file:Assets/Props/chair.prop.lsb"
      responses:
        '200':
          description: 実際にエントリが取り除かれたかどうか。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  removed: { type: boolean, example: true }
        '400':
          description: "`sourceKey` がない。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------- Web UI
  /live/ui/sidemenu:
    get:
      tags: [Web UI]
      summary: Unity 側で構成したサイドメニューを取得する
      description: >
        リモートアプリが出すべきページを順序どおりに、ラベルは現在の言語へ翻訳済みで返します。
        各項目はページの種類と、該当すればセレクターや「+」ボタンを支えるライブオブジェクトを
        示します。`/live/changes` が擬似 id `@ui` を報告したら取り直してください。
      responses:
        '200':
          description: メニュー項目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UISideMenuResponse"

  /live/ui/info:
    get:
      tags: [Web UI]
      summary: アプリのタイトルを取得する
      responses:
        '200':
          description: リモートアプリのタイトルバーに出す名前。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIInfoResponse"

components:
  parameters:
    ClientId:
      in: header
      name: X-Client-ID
      required: false
      schema:
        type: string
      example: "remote-app-9f2c"
      description: >
        呼び出し元クライアントの安定した識別子。省略すると `<アドレス>:<ポート>` に
        フォールバックしますが、これは再接続をまたいで安定しません。

    ObjectId:
      in: path
      name: id
      required: true
      schema:
        type: string
      example: "3470a41c-f079-4d30-a002-3468fda088f7"
      description: "ライブオブジェクトの id。スラッシュを含むことはありません。"

    PropertyPath:
      in: path
      name: path
      required: true
      schema:
        type: string
      example: "intensity"
      description: >
        オブジェクトのルートからのプロパティパス。入れ子のメンバーや配列添字のためにスラッシュを
        含むことがあります — `controller/distance`、`expressions/0/weight` のように。

    Nested:
      in: query
      name: nested
      required: false
      schema:
        type: boolean
      example: true
      description: >
        任意のフラグ。指定がなければ (既定) 各オブジェクトは深さ 1 で返ります。自身のプロパティ値は
        シリアライズされますが、入れ子の (登録されていない) 複合的な子は切り詰めスタブ
        (`{ "@type": ..., "@truncated": true }`) に置き換わります。ペイロードを小さく保ち、規模に
        耐えさせるためです。配列は深さを消費しないので、要素数と要素ごとの型は見えたままです。
        切り詰められた子は `GET /live/object/{id}/{path}` で必要になった時点で取得します。
        `?nested` (または `?nested=true`) を渡すと完全展開に戻ります。
        (今のところ深さは 1 か無制限かの 2 択です。将来 `?nested=<N>` の数値形式で露出するかも
        しれません)

  schemas:
      StatusResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          applicationName:
            type: string
            example: "LiveStudio"
          version:
            type: string
            example: "0.26.0"
          fps:
            type: number
            example: 60
          instanceId:
            type: string
            example: "8f6a1b30-2f0e-4a2f-9d1a-8c2f0a1b3c4d"
            description: >
              サーバーのこの起動を識別する値。新しい値を見たクライアントは、手元の revision・
              イベントカーソル・キャッシュ済みオブジェクトをすべて捨ててください。

      EventsResponse:
        type: object
        properties:
          lastEventId:
            type: integer
            format: int64
            example: 42
            description: >
              次回のポーリングで `since` に渡す値。受信箱が空のときは送った `since` がそのまま
              返るので、読み取り位置は動きません。
          events:
            type: array
            description: >
              溜まっている通知を古い順に。各項目はイベント自身のペイロードで、`type` と `timestamp`
              は常に埋まっています。クライアントは `type` で振り分け、それに従って残りを読みます。
            items:
              type: object
              properties:
                type:
                  type: string
                  example: "system_notification"
                  description: >
                    語彙は開いています。よく使う値: `system_notification` (表示するトースト)、
                    `confirm_request` / `confirm_dismiss` (確認ダイアログの表示・取り下げ。回答は
                    `POST /live/confirm`)。ほかのパッケージが独自の型を足します。知らない型は
                    無視してください。
                timestamp:
                  type: string
                  format: date-time
              additionalProperties:
                description: "このイベント型に固有のフィールド。"

      ConfirmRequest:
        type: object
        required: [id, choice]
        properties:
          id:
            type: string
            example: "confirm-3"
          choice:
            type: string
            enum: [yes, no, cancel]
            example: "yes"

      ConfirmResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          settled:
            type: boolean
            example: true
            description: "ほかの画面が先に回答した、または問い自体がもう無いときは false。"
          timestamp:
            type: string
            format: date-time

      PerformanceResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          fps:
            type: number
            example: 59.8
            description: "直近 1 秒の移動平均フレームレート。"
          memory:
            type: integer
            format: int64
            example: 1073741824
            description: "プロセスのワーキングセット (バイト)。"

      LanguageResponse:
        type: object
        properties:
          current:
            type: string
            example: "ja"
          available:
            type: array
            items:
              type: string
            example: ["en", "ja", "zh-CN"]

      CommandResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: "Application quit initiated."
          timestamp:
            type: string
            format: date-time

      AssetListResponse:
        type: object
        properties:
          type:
            type: string
            example: "AnimationClip"
            description: "要求された型のエコー (指定が無ければ空)。"
          assets:
            type: array
            items:
              type: object
              properties:
                key:
                  type: string
                  example: "file:Assets/Packs/dances.pack.lsb#Wave"
                  description: >
                    アセット参照プロパティへ、そのまま書き込める値。ベイク済みや組み込みなら素の GUID、
                    まとまりのメンバーなら組み込み側のアプリが決めた形式の参照です。
                name:
                  type: string
                  example: "Wave"
                type:
                  type: string
                  example: "AnimationClip"

      AssetInfoResponse:
        type: object
        properties:
          guid:
            type: string
            example: "b1f2c3d4e5f60718293a4b5c6d7e8f90"
          name:
            type: string
            example: "Idle"
          type:
            type: string
            example: "AnimationClip"
            description: "名前だけで解決した場合 (対象が未読み込み) は空。"

      ScenePathRequest:
        type: object
        required: [path]
        properties:
          path:
            type: string
            example: "data.json"
            description: >
              絶対パス、またはアプリの `Saved` フォルダからの相対パス。

      PropertySettingRequest:
        type: object
        properties:
          value:
            description: "新しい値。そのプロパティの JSON 表現で。"
            example: 100
          changed:
            type: boolean
            example: true

      PropertyGettingResponse:
        type: object
        properties:
          value:
            description: "プロパティの値。その JSON 表現で。"
            example: 100
          id:
            type: string
            example: "3470a41c-f079-4d30-a002-3468fda088f7"
            description: "所有オブジェクトの id。セレクター経由でたどった場合、リクエストの {id} と異なることがあります。"
          path:
            type: string
            example: "intensity"
            description: "所有オブジェクトのルートからのスラッシュ区切りプロパティパス (例: 'objects/0/_config')。"
          changed:
            type: boolean
            example: true
            description: "値が既定値と異なるかどうか。UI の「元に戻す」表示のためのもので、更新の成否ではありません。"

      ChangesResponse:
        type: object
        properties:
          revision:
            type: integer
            format: int64
            example: 57
          changes:
            type: array
            items:
              type: string
            example: ["2e910ddf-8cd8-4fb2-92f3-44b1ccd20c5f", "@types"]

      BatchRequest:
        type: object
        required:
          - requests
        properties:
          requests:
            type: array
            items:
              $ref: "#/components/schemas/BatchSubRequest"

      BatchSubRequest:
        type: object
        required:
          - method
          - path
        properties:
          id:
            description: "クライアントが付ける相関 id。対応するレスポンス項目にそのまま返ります。任意の JSON 値。省略可 (その場合 null で返る)。"
            example: 1
          method:
            type: string
            description: "サブリクエストの HTTP メソッド (大文字小文字は問わない)。"
            enum: [GET, PUT, POST, DELETE, PATCH]
            example: PUT
          path:
            type: string
            description: "サブリクエストの絶対パス。クエリを含む。"
            example: "/live/object/3470a41c-f079-4d30-a002-3468fda088f7/intensity"
          body:
            type: object
            description: "サブリクエストの JSON 本文 (PUT なら {\"value\": 100}、関数呼び出しなら {\"args\": [..]} など)。不要なら省略。"
            example: { "value": 100 }

      BatchResponse:
        type: object
        properties:
          responses:
            type: array
            items:
              $ref: "#/components/schemas/BatchResponseItem"

      BatchResponseItem:
        type: object
        properties:
          id:
            description: "サブリクエストの id のエコー (省略されていた場合は null)。"
            example: 1
          status:
            type: integer
            description: "項目ごとの HTTP 相当ステータス (成功は 200、失敗は 400/404/405/500)。"
            example: 200
          body:
            description: "成功時はその操作の通常のレスポンス JSON (PropertyGettingResponse、関数なら {\"result\": ..} など)。失敗時は {\"error\": <メッセージ>}。"
            example: { "value": 100, "id": "3470a41c-f079-4d30-a002-3468fda088f7", "path": "intensity", "changed": true }

      PropertyDeleteRequest:
        type: object
        properties:
          index:
            type: number
            example: -1
            description: 配列プロパティから取り除く要素の添字。-1 は末尾。

      PropertyReorderRequest:
        type: object
        required:
          - fromIndex
          - toIndex
        properties:
          fromIndex:
            type: integer
            example: 2
            description: 動かす要素の現在の添字
          toIndex:
            type: integer
            example: 0
            description: 移動先の添字

      ObjectGettingResponse:
        type: object
        description: >
          ライブオブジェクト自体がプロパティの入れ物です。`@type` / `@id` / `@name` は常にあり、
          公開された各プロパティがそれぞれの名前で同じ階層に並びます。
        properties:
          "@type":
            type: string
            example: "Light"
          "@id":
            type: string
            example: "2e910ddf-8cd8-4fb2-92f3-44b1ccd20c5f"
          "@name":
            type: string
            example: "Directional Light"
        additionalProperties:
          description: "公開プロパティ 1 つ。その JSON 表現で。"

      ObjectsGettingResponse:
        type: object
        properties:
          objects:
            type: array
            items:
              $ref: "#/components/schemas/ObjectGettingResponse"

      TypesGettingResponse:
        type: object
        properties:
          types:
            type: array
            items:
              $ref: "#/components/schemas/TypeDefinition"

      TypeDefinition:
        type: object
        description: >
          型 1 件の定義。`/live/types` の配列要素であり、`/live/type/{name}` が単体で返すものと
          同一です。
        properties:
          type:
            type: string
            example: "Light"
          category:
            type: string
            example: "Lighting"
            description: >
              この型が属するサイドメニューのページ。表示用に**翻訳済み**です。型がカテゴリを
              宣言していなければ省略されます。`/live/objects?category=` の絞り込みには翻訳前の
              キーが要るので、この値をそのまま渡さないでください。
          properties:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                  example: "intensity"
                type:
                  type: string
                  example: "Single"
                isReadOnly:
                  type: boolean
                  example: false
                isArray:
                  type: boolean
                  example: false
                order:
                  type: integer
                  example: 0
                  description: "プロパティと関数を混ぜて並べるための宣言順"
                help:
                  type: string
                  example: "Brightness of the light"
                  description: "プロパティがヘルプキーを宣言している場合の、翻訳済みヘルプ文。"
                controller:
                  $ref: "#/components/schemas/PropertyController"
          functions:
            type: array
            description: "この型で呼び出せる関数"
            items:
              type: object
              properties:
                name:
                  type: string
                  example: "resetPhysics"
                returnType:
                  type: string
                  example: "Void"
                order:
                  type: integer
                  example: 5
                  description: "プロパティと関数を混ぜて並べるための宣言順"
                help:
                  type: string
                  example: "Reset physics simulation"

      PropertyController:
        type: object
        description: >
          クライアントがそのプロパティをどう描画すべきか。`type` は開いた語彙なので、知らない
          コントローラーはプロパティの型に応じた素のエディタへフォールバックしてください。
        properties:
          type:
            type: string
            example: "Slider"
            description: >
              よく使う値: Default, Hide, Slider, CameraController, TypeSelector, StringSelector,
              GLTFFileSelector, AssetSelector, InlineReference。
          min:
            type: number
            example: 0
          max:
            type: number
            example: 100

      EnumsGettingResponse:
        type: object
        properties:
          enums:
            type: array
            items:
              $ref: "#/components/schemas/EnumDefinition"

      EnumDefinition:
        type: object
        description: >
          enum 1 件の定義。`/live/enums` の配列要素であり、`/live/enum/{name}` が単体で返すものと
          同一です。
        properties:
          type:
            type: string
            example: "CameraProjection"
          help:
            type: string
            example: "How the camera projects the scene"
            description: "enum がヘルプキーを宣言している場合の、翻訳済みヘルプ文。"
          values:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                  example: "Perspective"
                value:
                  type: integer
                  example: 0
                displayName:
                  type: string
                  example: "Perspective"
                  description: "表示するラベル。宣言がなければ `name` にフォールバックします。"

      ErrorResponse:
        type: object
        properties:
          error:
            type: string
            example: "Asset not found."

      SuccessResponse:
        type: object
        properties:
          success:
            type: boolean
            example: true

      UISideMenuResponse:
        type: object
        properties:
          menuItems:
            type: array
            items:
              $ref: "#/components/schemas/UIMenuItem"

      UIInfoResponse:
        type: object
        properties:
          title:
            type: string
            example: "LiveStudio"
            description: "リモートアプリのタイトルバーに出すアプリ名 (Unity の Application.productName)。"

      UIMenuItem:
        type: object
        properties:
          id:
            type: string
            example: "avatar"
          icon:
            type: string
            example: "person"
          label:
            type: string
            example: "Avatar"
            description: "現在の言語へ翻訳済み。"
          pageType:
            type: string
            enum: [category, scene, navigate, ""]
            example: "category"
            description: >
              `category` は 1 つのカテゴリのオブジェクトを並べるページ、`scene` はライブオブジェクトの
              ツリー、`navigate` は中身をセレクターで選ぶページ。どれでもない場合は空です。
          selectorObjectId:
            type: string
            example: "ui.selector.avatar"
            description: "そのページのセレクターを支えるライブオブジェクト。無ければ空。"
          factoryObjectId:
            type: string
            example: "ui.factory.avatar"
            description: "そのページの「+」ボタンを支えるライブオブジェクト。無ければ空。"
          position:
            type: string
            enum: [main, bottom]
            example: "main"
          order:
            type: integer
            example: 10
          accessLevel:
            type: integer
            example: 0
            description: "そのページの公開段階。クライアントは自分の動作段階を超える項目を隠します。"
