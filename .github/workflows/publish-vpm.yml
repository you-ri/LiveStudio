name: Publish VPM

# Publishes the LiveStudio packages to the VPM repository hosted on
# GitHub Pages. Fires automatically when Beta Release pushes a tag (v*), and
# can also be dispatched manually to re-publish an existing tag.
#
# Output artefacts per package:
# - GitHub Release asset: <name>-<version>.zip
# - GitHub Pages site:    https://<owner>.github.io/<repo>/vpm.json
#
# VCC users add the vpm.json URL once, then receive new versions automatically
# as new tags are pushed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish (e.g. v0.20.2). Leave blank when fired by tag push.'
        required: false
        type: string
      dry_run:
        description: 'Skip Release upload and Pages deploy. Emit the zips and merged vpm.json as workflow artifacts instead.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write     # Required for uploading Release assets
  pages: write        # Required for deploying to GitHub Pages
  id-token: write     # Required by actions/deploy-pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Packages published to VPM. One folder per line. Each folder must contain
  # a package.json. To add or remove a package, edit this list only — the
  # rest of the workflow iterates over it.
  VPM_PACKAGES: |
    Packages/LiveStudio
    Packages/LiveStudioVirgo
    Packages/RemoteControl
    Packages/NativeGamepad
    Packages/VRChatAvatarTransfer

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "workflow_dispatch requires a non-empty 'tag' input" >&2
              exit 2
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing tag: $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          lfs: true

      - name: Pack each package as zip and compute SHA-256
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _zips
          # Emit a JSON array of {pkg_path, pkg_json, name, version, zip, sha256}
          # so later steps can iterate without re-reading files.
          ENTRIES='[]'
          while IFS= read -r PKG_PATH; do
            [ -z "$PKG_PATH" ] && continue
            PKG_JSON="$PKG_PATH/package.json"
            if [ ! -r "$PKG_JSON" ]; then
              echo "Missing $PKG_JSON" >&2
              exit 2
            fi
            NAME=$(jq -r .name "$PKG_JSON")
            VER=$(jq -r .version "$PKG_JSON")
            ZIP="${NAME}-${VER}.zip"
            ZIP_ABS="${GITHUB_WORKSPACE}/_zips/${ZIP}"
            ( cd "$PKG_PATH" && zip -r "$ZIP_ABS" . -x ".git*" )
            SHA=$(sha256sum "$ZIP_ABS" | awk '{print $1}')
            echo "Packed $NAME@$VER -> $ZIP ($(du -h "$ZIP_ABS" | awk '{print $1}'), sha256=${SHA:0:12}...)"
            ENTRIES=$(echo "$ENTRIES" | jq \
              --arg pkg_path "$PKG_PATH" \
              --arg pkg_json "$PKG_JSON" \
              --arg name "$NAME" \
              --arg version "$VER" \
              --arg zip "$ZIP" \
              --arg sha "$SHA" \
              '. + [{pkg_path: $pkg_path, pkg_json: $pkg_json, name: $name, version: $version, zip: $zip, sha256: $sha}]')
          done <<< "$VPM_PACKAGES"
          echo "$ENTRIES" > _zips/entries.json
          echo "--- packed packages ---"
          jq -r '.[] | "\(.name)@\(.version) -> \(.zip)"' _zips/entries.json

      - name: Ensure GitHub Release exists and upload zips
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # Beta Release creates the tag and the GitHub Release back-to-back.
          # The tag push triggers this workflow asynchronously, so the Release
          # may not be visible yet on the first check. Poll briefly.
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "Release $TAG not visible yet (attempt $i), sleeping..."
            sleep 5
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG missing; creating prerelease shell."
            gh release create "$TAG" --prerelease --generate-notes \
              --title "LiveStudio $TAG"
          fi
          jq -r '.[].zip' _zips/entries.json | while IFS= read -r ZIP; do
            gh release upload "$TAG" "_zips/$ZIP" --clobber
          done

      - name: Fetch existing vpm.json (if any)
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          OWNER="${{ github.repository_owner }}"
          PAGES_URL="https://${OWNER}.github.io/${REPO_NAME}/vpm.json"
          if curl -sfL -o existing.json "$PAGES_URL"; then
            echo "Fetched existing vpm.json from $PAGES_URL"
          else
            echo "No existing vpm.json at $PAGES_URL; using empty skeleton."
            jq -n \
              --arg url "$PAGES_URL" \
              '{
                name: "Lilium VPM",
                id: "jp.lilium.vpm",
                url: $url,
                author: "Syrize",
                packages: {}
              }' > existing.json
          fi

      - name: Build merged vpm.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          TAG="${{ steps.tag.outputs.tag }}"
          CURRENT_INDEX=existing.json
          # Merge each package one by one. MergeVpmIndex.sh writes the merged
          # result to stdout, so we stage to a temp file and rotate it in.
          jq -c '.[]' _zips/entries.json | while IFS= read -r ENTRY; do
            NAME=$(echo "$ENTRY" | jq -r .name)
            VER=$(echo "$ENTRY" | jq -r .version)
            PKG_JSON=$(echo "$ENTRY" | jq -r .pkg_json)
            ZIP=$(echo "$ENTRY" | jq -r .zip)
            SHA=$(echo "$ENTRY" | jq -r .sha256)
            ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
            bash Scripts/MergeVpmIndex.sh \
              "$CURRENT_INDEX" \
              "$PKG_JSON" \
              "$ZIP_URL" \
              "$SHA" \
              > merged.json
            mv merged.json "$CURRENT_INDEX"
            echo "Merged $NAME@$VER (url=$ZIP_URL)"
          done
          cp "$CURRENT_INDEX" _site/vpm.json
          echo "--- vpm.json (summary) ---"
          jq '.packages | to_entries | map({key, versions: (.value.versions | keys)})' _site/vpm.json

      - name: Validate merged vpm.json
        shell: bash
        run: |
          set -euo pipefail
          jq empty _site/vpm.json
          # Every packed entry must appear in the merged index.
          jq -c '.[]' _zips/entries.json | while IFS= read -r ENTRY; do
            NAME=$(echo "$ENTRY" | jq -r .name)
            VER=$(echo "$ENTRY" | jq -r .version)
            jq -e \
              --arg name "$NAME" \
              --arg ver  "$VER" \
              '.packages[$name].versions[$ver].url' \
              _site/vpm.json > /dev/null || {
                echo "validation failed: $NAME@$VER not in merged vpm.json" >&2
                exit 1
              }
          done

      - uses: actions/upload-pages-artifact@v3
        if: inputs.dry_run != true
        with:
          path: _site

      - id: deploy
        if: inputs.dry_run != true
        uses: actions/deploy-pages@v4

      - name: Upload dry-run artifacts
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: vpm-dryrun-${{ steps.tag.outputs.tag }}
          path: |
            _zips/*.zip
            _site/vpm.json
          if-no-files-found: error
          retention-days: 7
